# Masaüstü uygulaması sürümü — "v*" etiketi push'layınca macOS ve Windows için derler, GitHub Releases'a yükler.
# Kullanım:  git tag v2.10.0 && git push origin v2.10.0
# Uygulamalar yeni sürümü kendisi fark eder ve güncellenir.
name: Masaüstü sürümü

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Release tek sefer oluşturulur; mac ve windows işleri dosyalarını aynı release'e yükler
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      # docs/releases/<etiket>.md varsa sürüm notu olarak kullanılır (uygulamadaki "Yenilikler" penceresi de bunu gösterir);
      # yoksa GitHub commit'lerden otomatik not üretir.
      - name: Release'i oluştur
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "News ${GITHUB_REF_NAME#v}" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "News ${GITHUB_REF_NAME#v}" --generate-notes
          fi
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  build:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: release:mac
          - os: windows-latest
            script: release:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sürümü etiketten al
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      # Kilit dosyası başka bir işletim sisteminde üretildiği için o sisteme özel opsiyonel paketler
      # (@rollup/rollup-darwin-arm64, @rollup/rollup-win32-x64-msvc…) eksik kalabiliyor (npm/cli#4828).
      # Bu yüzden derleme makinesinde kilit dosyası silinip bağımlılıklar sıfırdan çözülür.
      - name: Bağımlılıkları kur
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Derle ve yayınla
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
