# Haber toplayıcı — her 30 dakikada bir kaynakları tarar, Türkçeye çevirir, Firebase RTDB'ye yazar.
# Gerekli secret: FIREBASE_SERVICE_ACCOUNT
name: Haber toplayıcı

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npm run ingest
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DATABASE_URL: https://news-2afea-default-rtdb.firebaseio.com
