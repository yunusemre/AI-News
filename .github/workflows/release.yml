# Masaüstü uygulaması sürümü — "v*" etiketi push'layınca macOS'ta derler ve GitHub Releases'a yükler.
# Kullanım:  git tag v2.1.0 && git push origin v2.1.0
# Uygulamalar yeni sürümü kendisi fark eder ve "Güncelle" şeridini gösterir.
name: Masaüstü sürümü

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Sürümü etiketten al
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Derle ve yayınla
        run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
