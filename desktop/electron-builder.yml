appId: com.yunusemretatar.ai-haberleri
productName: News
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
asarUnpack: []
electronLanguages: [tr, en]
mac:
  icon: resources/icon.png
  category: public.app-category.news
  darkModeSupport: true
  target:
    - target: dmg
      arch: [arm64]
    - target: zip          # uygulama içi güncelleme bu dosyayı indirir
      arch: [arm64]
  # Apple Developer hesabı olmadan: ad-hoc imza (sadece kendi Mac'lerinde çalışır)
  identity: "-"
  hardenedRuntime: false
  notarize: false
  artifactName: News-${version}-${arch}-mac.${ext}
dmg:
  title: News
  artifactName: News-${version}-${arch}.${ext}
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
  # İmza sertifikası yok: ilk kurulumda SmartScreen "Yine de çalıştır" ister
nsis:
  oneClick: true            # tek tıkla kullanıcı klasörüne kurar (yönetici izni gerekmez)
  perMachine: false
  artifactName: News-Setup-${version}.${ext}
  shortcutName: News
  uninstallDisplayName: News
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  target: [AppImage]
  category: News

# GitHub Releases'a yayın (release workflow'u kullanır)
publish:
  provider: github
  owner: yunusemre
  repo: AI-News
  releaseType: release
