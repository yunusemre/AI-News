# Haber toplayıcı — günde 3 kez (09:00, 14:00, 20:00 TR) kaynakları tarar, Türkçeye çevirir, Firebase RTDB'ye yazar.
# Gerekli secret: FIREBASE_SERVICE_ACCOUNT
name: Haber toplayıcı

on:
  schedule:
    - cron: "0 6,11,17 * * *"     # 09:00, 14:00, 20:00 (Türkiye saati, UTC+3)
  workflow_dispatch: {}
  # Kaynak / kategori / ayar dosyaları değişince hemen senkronize et ve tara
  push:
    branches: [main, master]
    paths:
      - firebase/sources.json
      - firebase/categories.json
      - firebase/config.json

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npm run ingest -- --sync-config
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DATABASE_URL: https://news-2afea-default-rtdb.firebaseio.com
