# Masaüstü uygulaması sürümü — "v*" etiketi push'layınca macOS'ta derler ve GitHub Releases'a yükler.
# Kullanım:  git tag v2.1.0 && git push origin v2.1.0
# Uygulamalar yeni sürümü kendisi fark eder ve "Güncelle" şeridini gösterir.
name: Masaüstü sürümü

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sürümü etiketten al
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      # npm ci yerine install: kilit dosyası farklı işletim sisteminde üretilmiş olsa bile
      # (macOS'a özel / Windows'a özel opsiyonel paketler) derleme makinesi kendisi çözer.
      - name: Bağımlılıkları kur
        # Kilit dosyası farklı işletim sisteminde üretildiği için macOS'a özel opsiyonel paketler
        # (@rollup/rollup-darwin-arm64, dmg-license…) eksik kalıyor (npm/cli#4828).
        # Bu yüzden derleme makinesinde kilit dosyası silinip bağımlılıklar sıfırdan çözülür.
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Release'i önceden oluştur (dmg ve zip aynı release'e yüklensin)
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Derle ve yayınla
        run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
